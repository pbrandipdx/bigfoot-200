<title>Bigfoot 200 Racebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#eeeeec; --surface:#fbfbfa; --surface-2:#f4f4f2;
  --ink:#16181a; --ink-2:#4b5057; --muted:#858a90;
  --line:#dcdcd8; --line-2:#c9c9c4;
  --moss:#3d6b4a; --moss-soft:rgba(61,107,74,.10); --moss-line:rgba(61,107,74,.28);
  --ember:#a94d1c; --ember-soft:rgba(169,77,28,.10);
  --good:#3d6b4a; --warn:#a97a1c; --bad:#a3402c;
  --shadow:0 1px 1px rgba(22,24,26,.04), 0 10px 30px rgba(22,24,26,.05);
  --f-display:"Zilla Slab", Georgia, serif;
  --f-body:"Archivo", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0f1011; --surface:#191b1c; --surface-2:#212325;
    --ink:#f3f3f1; --ink-2:#b6babe; --muted:#80858b;
    --line:#2a2d2f; --line-2:#3a3e41;
    --moss:#7fc094; --moss-soft:rgba(127,192,148,.12); --moss-line:rgba(127,192,148,.30);
    --ember:#e08a52; --ember-soft:rgba(224,138,82,.12);
    --good:#7fc094; --warn:#d9a441; --bad:#e0765c;
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0f1011; --surface:#191b1c; --surface-2:#212325;
  --ink:#f3f3f1; --ink-2:#b6babe; --muted:#80858b;
  --line:#2a2d2f; --line-2:#3a3e41;
  --moss:#7fc094; --moss-soft:rgba(127,192,148,.12); --moss-line:rgba(127,192,148,.30);
  --ember:#e08a52; --ember-soft:rgba(224,138,82,.12);
  --good:#7fc094; --warn:#d9a441; --bad:#e0765c;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:var(--moss)}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* masthead */
.masthead{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.mast-inner{max-width:940px;margin:0 auto;padding:16px 20px 12px;display:flex;align-items:flex-end;gap:18px}
.eyebrow{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mast-inner h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:3px}
.mast-inner h1 em{font-style:normal;color:var(--moss)}
.grow{flex:1}
.countdown{text-align:right;font-family:var(--f-mono);line-height:1.05;flex:none}
.countdown .big{display:block;font-size:26px;font-weight:500;letter-spacing:-.02em}
.countdown .unit{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.themebtn{flex:none;background:none;border:1px solid var(--line-2);color:var(--ink-2);border-radius:7px;
  width:32px;height:32px;cursor:pointer;font-size:14px;line-height:1}
.themebtn:hover{background:var(--surface-2)}

.tabs{max-width:940px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss)}

main{max-width:940px;margin:0 auto;padding:26px 20px 80px}
.panel{display:flex;flex-direction:column;gap:22px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.block > h2{font-size:12px;font-family:var(--f-body);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px}
.block.plain{background:none;border:0;box-shadow:none;padding:0}
h3.sec{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.01em;margin:6px 0 10px}
p{margin:0 0 12px;max-width:66ch;color:var(--ink-2)}
p:last-child{margin-bottom:0}
p strong,li strong{color:var(--ink);font-weight:600}
.lede{font-size:17px;color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{background:var(--surface);padding:15px 17px 16px}
.tile .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--f-mono);font-size:27px;font-weight:500;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.tile .val small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.35}

/* meters */
.meter + .meter{margin-top:14px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.mrow .nm{color:var(--ink-2)}
.mrow .vl{font-family:var(--f-mono);font-weight:500}
.mrow .vl .t{color:var(--muted);font-weight:400}
.bar{height:7px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:2px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-family:var(--f-mono);font-weight:400}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}
thead th{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--moss-soft)}
tr.grp td{background:var(--surface-2);font-family:var(--f-body);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
tr.here td{box-shadow:inset 3px 0 0 var(--moss)}
tr.tot td{font-weight:500;border-top:1px solid var(--line-2);background:var(--surface-2)}
td.dim{color:var(--muted)}
.sleepcell{color:var(--ember);font-weight:500}

/* chart */
.chartbox{overflow-x:auto;position:relative}
.chartbox svg{display:block;min-width:660px;width:100%;height:auto}
.key{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 12px}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--moss);margin-right:6px;vertical-align:-1px}
.key i.pre{background:var(--muted)}
.key u{display:inline-block;width:15px;border-top:2px dashed var(--muted);margin-right:6px;vertical-align:4px;text-decoration:none}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;font-family:var(--f-mono);
  box-shadow:var(--shadow);white-space:nowrap;z-index:5}

/* callout */
.callout{border-left:3px solid var(--ember);background:var(--ember-soft);border-radius:0 9px 9px 0;
  padding:13px 16px;font-size:14px;color:var(--ink-2);margin-top:16px}
.callout strong{color:var(--ink)}
.rule{border-left:3px solid var(--moss);background:var(--moss-soft);border-radius:0 9px 9px 0;
  padding:13px 16px;font-size:14px;color:var(--ink-2);margin-top:16px}
.rule strong{color:var(--ink)}

ul.tight{margin:0;padding-left:20px;color:var(--ink-2);font-size:14.5px}
ul.tight li{margin:6px 0;max-width:64ch}
ul.plainlist{list-style:none;margin:0;padding:0}
ul.plainlist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
ul.plainlist li:last-child{border-bottom:0}
ul.plainlist b{display:block;color:var(--ink);font-weight:600;font-size:14.5px;margin-bottom:2px}

details{border-top:1px solid var(--line);padding:11px 0 3px}
details summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--moss);font-family:var(--f-mono)}
details[open] summary::before{content:"– "}
details .body{padding:10px 0 4px;font-size:14px;color:var(--ink-2)}
details .body p{font-size:14px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:99px;background:var(--moss-soft);color:var(--moss);font-family:var(--f-body)}
.pill.ember{background:var(--ember-soft);color:var(--ember)}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.stat s{width:7px;height:7px;border-radius:50%;display:inline-block;text-decoration:none}
.stat.g{color:var(--good)} .stat.g s{background:var(--good)}
.stat.w{color:var(--warn)} .stat.w s{background:var(--warn)}
.stat.b{color:var(--bad)}  .stat.b s{background:var(--bad)}
.stat.n{color:var(--muted)} .stat.n s{background:var(--muted)}
footer{max-width:940px;margin:0 auto;padding:0 20px 50px;font-size:12.5px;color:var(--muted);text-align:center}

@media (max-width:640px){
  .mast-inner{padding:13px 16px 10px;gap:12px}
  .mast-inner h1{font-size:21px}
  .countdown .big{font-size:21px}
  main{padding:20px 16px 60px}
  .block{padding:16px 15px;border-radius:10px}
  h3.sec{font-size:19px}
  .tabs{padding:0 16px}
  footer{padding:0 16px 40px}
}
</style>
