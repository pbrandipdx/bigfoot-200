<script>
(function(){
"use strict";
var SYNC = /*__DATA__*/;

var BASE=Date.UTC(2026,8,7), NPLAN=49, RACE=Date.UTC(2027,7,13);
var BLOCKS=[
 {n:1,start:0,end:13,ends:"Frozen Trail Run Fest 50K",peak:[8,8],nightCum:4,
  q:"Can you sustain a full day on feet, descend hard without wrecking your quads, and rebuild the vertical base the old plan assumed you already had?"},
 {n:2,start:14,end:22,ends:"BURT 100 — first 100-miler (tentative)",peak:[10,12],nightCum:12,
  q:"Can you go out again on tired legs, in bad weather, when nothing about it is enjoyable — and finish 100 miles with a full night solo?"},
 {n:3,start:23,end:31,ends:"Gorge Waterfalls 100K — 14–15 hr",peak:[14,14],nightCum:24,
  q:"Can you move competently in the dark for six hours, alone, and still run the last 10K?"},
 {n:4,start:32,end:40,ends:"Bighorn 100 — the gate, sub-28",peak:[18,18],nightCum:40,
  q:"Can you run through a night and keep functioning the next day, with aid stops under 90 minutes total? Sub-100 at Bigfoot is decided here."},
 {n:5,start:41,end:48,ends:"BIGFOOT 200 — sub-100",peak:[20,20],nightCum:60,
  q:"Recover, peak once, then arrive fresh with sleep banked and heat in the legs."}
];
var DISP={1:{h:"10 → 15",v:"2,000 → 4,500",m:"32 → 50"},2:{h:"17",v:"6,000",m:"55"},
          3:{h:"19",v:"7,500",m:"60"},4:{h:"21",v:"9,500",m:"65"},5:{h:"23 peak",v:"12,000 peak",m:"70 peak"}};
var B5=[{h:5,v:1000,m:15,tag:"Recovery — walks only"},{h:5,v:1000,m:15,tag:"Recovery — walks only"},
        {h:23,v:12000,m:70,tag:"Peak"},{h:23,v:12000,m:70,tag:"Peak — one 20 hr day"},{h:23,v:12000,m:70,tag:"Peak"},
        {h:14,v:7200,m:42,tag:"Reduce 40%"},{h:9,v:4000,m:28,tag:"Taper"},{h:5,v:1500,m:15,tag:"Taper — race week"}];
function blockOf(i){for(var k=0;k<5;k++)if(i>=BLOCKS[k].start&&i<=BLOCKS[k].end)return BLOCKS[k];return BLOCKS[4];}
function target(i){var b=blockOf(i);
 if(b.n===1){var t=i/13;return{h:10+5*t,v:2000+2500*t,m:32+18*t,tag:"Rebuild the base"};}
 if(b.n===2)return{h:17,v:6000,m:55,tag:""};
 if(b.n===3)return{h:19,v:7500,m:60,tag:""};
 if(b.n===4)return{h:21,v:9500,m:65,tag:""};
 var w=B5[i-41]||B5[7];return{h:w.h,v:w.v,m:w.m,tag:w.tag};}
function nightCumTarget(i){var b=blockOf(i),prev=b.n===1?0:BLOCKS[b.n-2].nightCum,
 span=b.end-b.start,f=span===0?1:(i-b.start)/span;return prev+(b.nightCum-prev)*f;}

function iso(ms){return new Date(ms).toISOString().slice(0,10);}
function planStart(i){return BASE+i*7*86400000;}
var TL=[];
(function(){var ks=Object.keys(SYNC.weeks).sort();
 for(var j=0;j<ks.length;j++){var ms=Date.parse(ks[j]+"T00:00:00Z");if(ms<BASE)TL.push({ms:ms,key:ks[j],phase:"base",pi:null});}
 for(var i=0;i<NPLAN;i++){var m=planStart(i);TL.push({ms:m,key:iso(m),phase:"plan",pi:i});}})();
var FIRST=0;for(var z=0;z<TL.length;z++){if(TL[z].phase==="plan"){FIRST=z;break;}}
function D(t){return SYNC.weeks[t.key]||null;}
var NOW=Date.now(),CUR=0;for(var y=0;y<TL.length;y++)if(TL[y].ms<=NOW)CUR=y;
// if the current week has no data yet, show the last week that does
var SHOW=CUR,STALE=false;
if(!SYNC.weeks[TL[CUR].key]){for(var w=CUR;w>=0;w--){if(SYNC.weeks[TL[w].key]){SHOW=w;STALE=true;break;}}}

function fd(ms){return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});}
function fr(ms){var b=ms+6*86400000;return fd(ms)+"–"+fd(b)+", "+new Date(b).getUTCFullYear();}
function n0(x){return x==null?"—":Math.round(x).toLocaleString();}
function n1(x){return x==null?"—":(Math.round(x*10)/10).toLocaleString(undefined,{maximumFractionDigits:1});}
function cls(a,t){if(a==null)return"n";var r=a/t;return r>=1.18?"w":r>=.95?"g":r>=.8?"w":"b";}
function stat(c,txt){return'<span class="stat '+c+'"><s></s>'+txt+'</span>';}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function base12(){var p=[];for(var i=0;i<TL.length;i++){if(TL[i].phase!=="base")continue;var d=D(TL[i]);if(d)p.push(d);}
 p=p.slice(-12);if(!p.length)return null;
 var s={h:0,v:0,m:0,long:0,n:p.length};p.forEach(function(q){s.h+=q.hours;s.v+=q.vert;s.m+=q.miles;s.long=Math.max(s.long,q.longest);});
 s.h/=p.length;s.v/=p.length;s.m/=p.length;return s;}

/* ---- theme ---- */
try{var th=localStorage.getItem("bf.theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
document.getElementById("themebtn").addEventListener("click",function(){
 var c=document.documentElement.getAttribute("data-theme");
 var n=c==="dark"?"light":c==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
 document.documentElement.setAttribute("data-theme",n);
 try{localStorage.setItem("bf.theme",n);}catch(e){}
 charts();});

/* ---- tabs ---- */
var TABS=["now","training","raceday","vert","plan","ref"];
document.querySelectorAll(".tabs button").forEach(function(b){
 b.addEventListener("click",function(){
  document.querySelectorAll(".tabs button").forEach(function(o){o.setAttribute("aria-selected",String(o===b));});
  TABS.forEach(function(t){document.getElementById("p-"+t).hidden=(t!==b.dataset.tab);});
  window.scrollTo({top:0,behavior:"instant"});
  if(b.dataset.tab==="training")charts();
 });});

/* ---- tiles ---- */
(function(){
 var wl=Math.max(0,Math.ceil((RACE-NOW)/(7*86400000)));
 document.getElementById("cd").textContent=wl;
 var t=TL[CUR],where,sub;
 if(t.phase==="base"){where="Pre-plan";sub="Block 1 starts "+fd(BASE);}
 else{var b=blockOf(t.pi);where="Block "+b.n;sub="Week "+(t.pi-b.start+1)+" of "+(b.end-b.start+1)+" · ends "+b.ends;}
 var night=0;for(var i=0;i<TL.length;i++){var d=D(TL[i]);if(d&&TL[i].phase==="plan")night+=d.night||0;}
 var req=t.phase==="plan"?nightCumTarget(t.pi):0;
 var b12=base12();
 document.getElementById("tiles").innerHTML=
  tile("Weeks to Bigfoot",wl,"","Friday, Aug 13 2027 · noon")+
  tile("Where you are",where,"",sub)+
  tile("Last 12 weeks",b12?n1(b12.h):"—","hr/wk",b12?n0(b12.v)+" ft/wk · "+n0(b12.m)+" mi/wk":"no data")+
  tile("Night hours",n1(night),"banked",req<0.5?stat("n","first sessions due in November")
    :(night>=req?stat("g",n1(req)+" hr due by now"):stat("b",n1(req)+" hr due by now")));
})();
function tile(l,v,u,s){return'<div class="tile"><div class="lab">'+l+'</div><div class="val">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="sub">'+s+'</div></div>';}

/* ---- current week ---- */
(function(){
 var t=TL[SHOW],d=D(t),el=document.getElementById("meters");
 document.getElementById("curdates").textContent=(STALE?"last completed week · ":"")+fr(t.ms);
 if(t.phase==="base"){
  var b=base12();
  document.getElementById("curpill").textContent="Before the plan";
  el.innerHTML=[met("Time on feet",d?d.hours:null,b?b.h:12,"hr",n1,"against your 12-week average",true),
   met("Vertical",d?d.vert:null,b?b.v:1700,"ft",n0,"against your 12-week average",true),
   met("On-foot miles",d?d.miles:null,b?b.m:29,"mi",n0,"against your 12-week average",true),
   met("Longest single effort",d?d.longest:null,3,"hr",n1,"your longest to date is 3.0 hr",true)].join("");
  document.getElementById("blockq").innerHTML="<strong>Block 1 starts "+fd(BASE)+".</strong> Targets switch to the plan's numbers that week.";
  return;}
 var b2=blockOf(t.pi),tg=target(t.pi),best=null;
 for(var q=0;q<TL.length;q++){if(TL[q].phase!=="plan"||TL[q].pi<b2.start||TL[q].pi>b2.end)continue;var dd=D(TL[q]);if(dd)best=Math.max(best==null?0:best,dd.longest);}
 document.getElementById("curpill").textContent="Block "+b2.n+" · Week "+(t.pi-b2.start+1)+" of "+(b2.end-b2.start+1)+(tg.tag?" · "+tg.tag:"");
 el.innerHTML=met("Time on feet",d?d.hours:null,tg.h,"hr",n1)+met("Vertical",d?d.vert:null,tg.v,"ft",n0)+
  met("On-foot miles",d?d.miles:null,tg.m,"mi",n0)+
  '<div class="meter"><div class="mrow"><span class="nm">Longest single effort — best in block</span><span class="vl">'+
  (best==null?"—":n1(best))+' <span class="t">/ '+b2.peak[0]+(b2.peak[1]!==b2.peak[0]?"–"+b2.peak[1]:"")+' hr</span></span></div>'+
  '<div class="bar"><i style="width:'+(best==null?0:Math.min(100,best/b2.peak[0]*100))+'%"></i></div>'+
  '<div class="hint">Block target, not a weekly one — it has until '+fd(planStart(b2.end)+6*86400000)+' to land.</div></div>';
 document.getElementById("blockq").innerHTML="<strong>Block "+b2.n+" question:</strong> "+b2.q;
})();
function met(name,a,t,u,f,sub,neutral){
 var c=neutral?"":cls(a,t),pct=a==null?0:Math.min(100,a/t*100);
 return'<div class="meter"><div class="mrow"><span class="nm">'+name+'</span><span class="vl">'+(a==null?"—":f(a))+
  ' <span class="t">/ '+f(t)+' '+u+'</span></span></div><div class="bar"><i class="'+(c==="g"?"":c==="w"?"warn":c==="b"?"bad":"")+
  '" style="width:'+pct+'%"></i></div>'+(sub?'<div class="hint">'+sub+'</div>':'')+'</div>';}

/* ---- trajectory ---- */
(function(){
 // ordered list of weeks that actually have data
 var pts=[];
 for(var i=0;i<TL.length;i++){var d=D(TL[i]);if(d)pts.push({i:i,d:d});}
 var el=document.getElementById("traj");
 if(pts.length<4){el.innerHTML='<p class="hint">Not enough synced weeks yet to read a trend.</p>';return;}

 function slope(vals){ // least squares per week over the window
  var n=vals.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var k=0;k<n;k++){sx+=k;sy+=vals[k];sxy+=k*vals[k];sxx+=k*k;}
  var den=n*sxx-sx*sx; return den===0?0:(n*sxy-sx*sy)/den;}
 function avg(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}

 var win=pts.slice(-8), recent=pts.slice(-4), prior=pts.slice(-8,-4);
 var t=TL[SHOW];
 var b=t.phase==="plan"?blockOf(t.pi):BLOCKS[0];
 var exit=target(b.end), exitDate=fd(planStart(b.end)+6*86400000);
 // weeks from the last synced week to the block's final week
 var horizon=Math.max(1,(FIRST+b.end)-pts[pts.length-1].i);

 function row(name,key,exitTarget,fmt,unit){
  var vals=win.map(function(p){return p.d[key];});
  var m=slope(vals), cur=avg(recent.map(function(p){return p.d[key];}));
  var prev=prior.length?avg(prior.map(function(p){return p.d[key];})):null;
  var proj=cur+m*horizon;
  var delta=prev==null?null:(cur-prev)/prev*100;
  var hit=proj>=exitTarget*0.97;
  var dir=m>0.0001?"up":(m<-0.0001?"down":"flat");
  var arrow=dir==="up"?"▲":dir==="down"?"▼":"▬";
  var cl=hit?"g":(dir==="up"?"w":"b");
  return '<div class="meter"><div class="mrow"><span class="nm">'+name+
   '</span><span class="vl">'+fmt(cur)+' <span class="t">'+unit+'/wk now</span></span></div>'+
   '<div class="bar"><i class="'+(cl==="g"?"":cl==="w"?"warn":"bad")+
     '" style="width:'+Math.max(2,Math.min(100,cur/exitTarget*100))+'%"></i></div>'+
   '<div class="hint">'+arrow+' '+(dir==="flat"?"flat":(m>0?"+":"")+fmt(m)+" "+unit+"/wk")+
   (delta==null?"":" · "+(delta>0?"+":"")+Math.round(delta)+"% vs the 4 weeks before")+
   ' — at this rate you reach <strong>'+fmt(proj)+' '+unit+'</strong> by '+exitDate+
   ', against a Block '+b.n+' exit target of '+fmt(exitTarget)+'. '+
   (hit?'<span style="color:var(--good)">On pace.</span>':
        '<span style="color:var(--bad)">Short by '+fmt(Math.max(0,exitTarget-proj))+' '+unit+'.</span>')+'</div></div>';}

 el.innerHTML = row("Time on feet","hours",exit.h,n1,"hr")+
                row("Vertical","vert",exit.v,n0,"ft")+
                row("On-foot miles","miles",exit.m,n0,"mi");
 var nightSum=0;for(var q=0;q<TL.length;q++){var dd=D(TL[q]);if(dd&&TL[q].phase==="plan")nightSum+=dd.night||0;}
 var nreq=t.phase==="plan"?nightCumTarget(t.pi):0;
 document.getElementById("trajnote").innerHTML =
  "Trend is a least-squares fit over your last "+win.length+" synced weeks, projected to the end of Block "+b.n+
  " ("+exitDate+"). Night hours: <strong>"+n1(nightSum)+" banked</strong> against "+n1(nreq)+
  " due by now and "+b.nightCum+" by the end of the block.";
})();

/* ---- reality ---- */
(function(){
 var b=base12();if(!b)return;
 var A={h:12,v:3000,m:45,long:2.98};
 function row(n,a,as,u,f){var r=a/as,c=r>=.95?"g":r>=.8?"w":"b",p=Math.round((r-1)*100);
  return'<tr><td>'+n+'</td><td class="dim">'+f(as)+' '+u+'</td><td><strong>'+f(a)+'</strong> '+u+'</td><td>'+stat(c,(p>0?"+":"")+p+"%")+'</td></tr>';}
 document.getElementById("realtab").innerHTML=
  '<thead><tr><th>Metric</th><th>Original plan assumed</th><th>Last 12 weeks, measured</th><th>Gap</th></tr></thead><tbody>'+
  row("Time on feet",b.h,A.h,"hr/wk",n1)+row("Vertical",b.v,A.v,"ft/wk",n0)+
  row("On-foot miles",b.m,A.m,"mi/wk",n0)+row("Longest single effort",b.long,A.long,"hr",n1)+'</tbody>';
 document.getElementById("realnote").innerHTML=
  '<strong>The block targets are re-based on these numbers.</strong> The original plan started from 3,000 ft/week; you average '+
  n0(b.v)+', so its Block 1 target of 5,000 was '+(Math.round(5000/b.v*10)/10)+
  '× your real starting point rather than the 1.7× it implied. Block 1 now ramps 2,000 → 4,500 and the peak lands at 12,000.';
})();

/* ---- charts ---- */
function chart(mountId,tipId,o){
 var mount=document.getElementById(mountId),tip=document.getElementById(tipId);
 var W=1000,H=250,PL=54,PR=10,PT=12,PB=44,iw=W-PL-PR,ih=H-PT-PB,N=TL.length,max=0;
 for(var i=0;i<N;i++){var v=o.value(i),t=o.target(i);if(v!=null)max=Math.max(max,v);if(t!=null)max=Math.max(max,t);}
 max=(max*1.14)||1;
 var step=iw/N,bw=Math.min(12,step*.58);
 function x(i){return PL+i*step+step/2;} function yy(v){return PT+ih-(v/max)*ih;}
 var mut=css("--muted"),ln=css("--line"),l2=css("--line-2"),ac=css("--moss");
 var p=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.aria+'">'];
 ticks(max,5).forEach(function(tv){var Y=yy(tv);
  p.push('<line x1="'+PL+'" y1="'+Y+'" x2="'+(W-PR)+'" y2="'+Y+'" stroke="'+ln+'" stroke-width="1"/>');
  p.push('<text x="'+(PL-8)+'" y="'+(Y+4)+'" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="'+mut+'">'+o.ax(tv)+'</text>');});
 if(FIRST>0){var xs=PL+FIRST*step;
  p.push('<rect x="'+PL+'" y="'+PT+'" width="'+(xs-PL)+'" height="'+ih+'" fill="'+ln+'" opacity=".5"/>');
  p.push('<text x="'+(PL+(xs-PL)/2)+'" y="'+(H-26)+'" text-anchor="middle" font-size="11" fill="'+mut+'">Before the plan</text>');
  p.push('<line x1="'+xs+'" y1="'+PT+'" x2="'+xs+'" y2="'+(PT+ih)+'" stroke="'+l2+'" stroke-width="1.5"/>');}
 BLOCKS.forEach(function(b,k){var xs=PL+(FIRST+b.start)*step,w=(b.end-b.start+1)*step;
  if(k>0)p.push('<line x1="'+xs+'" y1="'+PT+'" x2="'+xs+'" y2="'+(PT+ih)+'" stroke="'+l2+'" stroke-width="1" stroke-dasharray="2 3"/>');
  p.push('<text x="'+(xs+w/2)+'" y="'+(H-26)+'" text-anchor="middle" font-size="11" fill="'+mut+'">Block '+b.n+'</text>');
  p.push('<text x="'+(xs+w/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="'+mut+'">'+fd(planStart(b.start))+'</text>');});
 p.push('<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="'+l2+'" stroke-width="1"/>');
 var d=[],on=false;
 for(var j=0;j<N;j++){var tv2=o.target(j);if(tv2==null){on=false;continue;}
  var x0=PL+j*step,x1=PL+(j+1)*step,Y=yy(tv2);d.push((on?"L":"M")+x0+" "+Y);d.push("L"+x1+" "+Y);on=true;}
 if(d.length)p.push('<path d="'+d.join(" ")+'" fill="none" stroke="'+mut+'" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>');
 for(var k2=0;k2<N;k2++){var v2=o.value(k2);if(v2==null)continue;var h=(PT+ih)-yy(v2);if(h<2)h=2;
  p.push('<rect x="'+(x(k2)-bw/2)+'" y="'+yy(v2)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(TL[k2].phase==="base"?mut:ac)+'"/>');}
 p.push('<line x1="'+x(CUR)+'" y1="'+PT+'" x2="'+x(CUR)+'" y2="'+(PT+ih)+'" stroke="'+ac+'" stroke-width="1" opacity=".4"/>');
 for(var k3=0;k3<N;k3++)p.push('<rect class="hit" data-i="'+k3+'" x="'+(PL+k3*step)+'" y="'+PT+'" width="'+step+'" height="'+ih+'" fill="transparent"/>');
 p.push('</svg>');
 mount.innerHTML=p.join("");mount.appendChild(tip);
 var svg=mount.querySelector("svg");
 svg.addEventListener("mousemove",function(e){
  var el=e.target.closest?e.target.closest(".hit"):null;
  if(!el){tip.style.opacity=0;return;}
  tip.innerHTML=o.tip(+el.getAttribute("data-i"));tip.style.opacity=1;
  var r=mount.getBoundingClientRect(),tx=e.clientX-r.left+14,ty=e.clientY-r.top-10;
  if(tx+tip.offsetWidth>mount.scrollLeft+r.width)tx=e.clientX-r.left-tip.offsetWidth-14;
  tip.style.left=tx+"px";tip.style.top=Math.max(0,ty)+"px";});
 svg.addEventListener("mouseleave",function(){tip.style.opacity=0;});
}
function ticks(max,n){var raw=max/n,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),nm=raw/mag;
 var s=(nm>=5?5:nm>=2?2:nm>=1?1:.5)*mag,o=[];for(var v=0;v<=max;v+=s)o.push(v);return o;}
function tipFor(i,label,val,tgt,f,u){var t=TL[i];
 var head=t.phase==="base"?"Before the plan":"Week "+(t.pi+1)+" · Block "+blockOf(t.pi).n;
 return"<b>"+head+"</b><br>"+fr(t.ms)+"<br>"+label+": <b>"+(val==null?"—":f(val)+" "+u)+"</b>"+(tgt==null?"":"<br>Target: "+f(tgt)+" "+u);}
function charts(){
 chart("c-hours","t-hours",{aria:"Weekly time on feet against block targets",
  value:function(i){var d=D(TL[i]);return d?d.hours:null;},
  target:function(i){return TL[i].phase==="plan"?target(TL[i].pi).h:null;},ax:n0,
  tip:function(i){var d=D(TL[i]);return tipFor(i,"Time on feet",d?d.hours:null,TL[i].phase==="plan"?target(TL[i].pi).h:null,n1,"hr");}});
 chart("c-vert","t-vert",{aria:"Weekly vertical gain against block targets",
  value:function(i){var d=D(TL[i]);return d?d.vert:null;},
  target:function(i){return TL[i].phase==="plan"?target(TL[i].pi).v:null;},
  ax:function(v){return v>=1000?(v/1000)+"k":n0(v);},
  tip:function(i){var d=D(TL[i]);return tipFor(i,"Vertical",d?d.vert:null,TL[i].phase==="plan"?target(TL[i].pi).v:null,n0,"ft");}});
 chart("c-long","t-long",{aria:"Longest single effort each week",
  value:function(i){var d=D(TL[i]);return d?d.longest:null;},
  target:function(i){return TL[i].phase==="plan"?blockOf(TL[i].pi).peak[0]:null;},ax:n0,
  tip:function(i){var d=D(TL[i]);return tipFor(i,"Longest effort",d?d.longest:null,TL[i].phase==="plan"?blockOf(TL[i].pi).peak[0]:null,n1,"hr");}});
}

/* ---- block + week tables ---- */
(function(){
 var b12=base12(),h='<thead><tr><th>Block</th><th>Weeks</th><th>Hr/wk</th><th>Vert/wk</th><th>Mi/wk</th><th>Peak day</th><th>Night</th><th>Ends with</th></tr></thead><tbody>';
 h+='<tr><td>Before the plan</td><td class="dim">last 12 weeks</td><td>'+(b12?n1(b12.h):"—")+'</td><td>'+(b12?n0(b12.v):"—")+
    '</td><td>'+(b12?n0(b12.m):"—")+'</td><td>'+(b12?n1(b12.long)+" hr":"—")+'</td><td>0</td><td class="dim">measured</td></tr>';
 BLOCKS.forEach(function(b){
  var Dp=DISP[b.n],hs=0,hn=0,vs=0,vn=0,ms=0,mn=0,best=null,nc=0;
  for(var i=0;i<TL.length;i++){var t=TL[i];if(t.phase!=="plan")continue;var d=D(t);if(!d)continue;
   if(t.pi<=b.end)nc+=d.night||0;
   if(t.pi<b.start||t.pi>b.end)continue;
   hs+=d.hours;hn++;vs+=d.vert;vn++;ms+=d.miles;mn++;best=Math.max(best==null?0:best,d.longest);}
  function lg(x){return' <span style="color:var(--muted)">· '+x+'</span>';}
  var here=TL[CUR].phase==="plan"&&TL[CUR].pi>=b.start&&TL[CUR].pi<=b.end;
